name: Publish mobile food picker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial website source
        shell: bash
        run: |
          if [ ! -f data/menu.json ]; then
            python3 -m zipfile -e haochi-mobile-initial-site.zip .
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .gitignore README.md package.json package-lock.json index.html src lib public data docs scripts
            git commit -m "Initialize mobile website source and published assets"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy mobile website
        id: deployment
        uses: actions/deploy-pages@v4
